name: AgentOps CI/CD & Golden Dataset Evaluation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  unit-tests-and-golden-eval:
    name: Run Unit Tests & Golden Dataset Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute AgentOps 19-Criterion Unit Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Execute Automated Golden Dataset Regression Harness
        run: |
          python eval/run_evaluation.py

  terraform-iac-validate:
    name: Validate Terraform Infrastructure as Code
    runs-on: ubuntu-latest
    needs: unit-tests-and-golden-eval
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format & Init (Backend Disabled)
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
